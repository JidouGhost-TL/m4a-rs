[package]
name = "m4a"
version = "0.1.0"
edition = "2021"
authors = ["The gbakit Authors"]
description = "Pure Rust, zero-dependency parser, software synthesizer, and mGBA ARM golden-tested emulator for the Nintendo MusicPlayer2000 (M4A / Sappy) GBA sound engine"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jidoughost-tl/m4a-rs"
keywords = ["gba", "m4a", "sappy", "audio", "synthesizer"]
categories = ["multimedia::audio", "emulators", "no-std"]

[dependencies]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dev-dependencies]

[[bench]]
name = "bench_audio"
harness = false
